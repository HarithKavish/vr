<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Shared theme from the main site, so VR follows it automatically. -->
    <link rel="stylesheet" href="https://harithkavish.com/style.css" />
    <script>
      // Set before first paint so the landing never flashes the wrong theme.
      document.documentElement.dataset.theme =
        localStorage.getItem('harithkavish-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title>VR — Harith Kavish</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
